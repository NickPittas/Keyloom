[project]
name = "corridorkey"
version = "2.1.5"
description = "AI Chroma Keyer by Corridor Digital"
license = {text = "CC-BY-NC-SA-4.0"}
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "numpy>=1.26,<2",
    "opencv-python-headless>=4.11,<5",  # 5.0 wheels dropped OpenEXR (#180)
    "OpenEXR>=3.4",
    "timm==1.0.24",  # BiRefNet remote code imports timm.layers
    "av",
    "diffusers",
    "easydict",
    "einops>=0.8",
    "kornia",
    "imageio",
    "huggingface_hub>=0.36",
    "socksio",  # socks5 proxy support for httpx model downloads
    "peft",
    "Pillow>=11",
    "PIMS",
    "setuptools",
    "tqdm>=4.67",
    "accelerate",
    "transformers>=4.57,<5",
    "safetensors>=0.6",
    "scipy>=1.16",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@83bfa5bda008803f6521ce9547f94023b8afeddd",  # CorridorKey 2.0 engine (vendored in CorridorKeyV2/)
    "matplotlib",
    "nvidia-ml-py",
    "PySide6>=6.7.0",
    "triton-windows>=3.5,<3.6; sys_platform == 'win32'",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff"]
tracker = ["sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4"]
quality = [
    "scikit-image",
    "pytorch-msssim",
    "lpips",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "ui", "CorridorKeyModule", "CorridorKeyV2", "gvm_core", "sam2_tracker", "VideoMaMaInferenceModule", "modules/MatAnyone2Module"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
torch-backend = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
