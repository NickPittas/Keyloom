[package]
name = "keyloom-ui"
version = "2.5.0"
edition = "2021"
default-run = "keyloom-ui"
description = "Keyloom native project viewer: imports footage into new projects (first slice, provisional toolkit)"

[lib]
name = "ck"
path = "src/lib.rs"

[[bin]]
name = "keyloom-ui"
path = "src/main.rs"

[[bin]]
name = "ck-bench"
path = "src/bin/ck-bench.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "accesskit"] }
exr = "1.74.2"
png = "0.18"
natord = "1.0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rfd = "0.17.2"
libloading = "0.8"
parking_lot = { version = "0.12", features = ["arc_lock"] }

# Tray: Linux speaks StatusNotifierItem over D-Bus (no GTK in a winit app); Windows uses the common tray-icon crate.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.21", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
debug = false
[profile.dev]
opt-level = 1
[profile.test]
opt-level = 2
