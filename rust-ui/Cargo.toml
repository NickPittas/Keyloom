[package]
name = "corridorkey-ui"
version = "0.1.0"
edition = "2021"
default-run = "corridorkey-ui"
description = "Native CorridorKey project viewer: imports footage into new projects (first slice, provisional toolkit)"

[lib]
name = "ck"
path = "src/lib.rs"

[[bin]]
name = "corridorkey-ui"
path = "src/main.rs"

[[bin]]
name = "ck-bench"
path = "src/bin/ck-bench.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
exr = "1.74.2"
png = "0.18"
natord = "1.0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rfd = "0.17.2"

[profile.release]
debug = false
[profile.dev]
opt-level = 1
[profile.test]
opt-level = 2
